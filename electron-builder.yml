appId: com.findoo.shortcut-for-orca
productName: Shortcut for Orca
directories:
  output: release
files:
  - dist/**
  - package.json
mac:
  category: public.app-category.developer-tools
  identity: "-"
  extendInfo:
    LSUIElement: true # menu bar app: no dock icon
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: findoo
  repo: shortcut-for-orca
  releaseType: release
releaseInfo:
  releaseNotesFile: docs/release-notes.md
