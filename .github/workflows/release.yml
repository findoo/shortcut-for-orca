name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm dist
      # One release created after both builds; electron-builder's own publishing races and makes two.
      - run: gh release create "$GITHUB_REF_NAME" release/*.dmg --title "${GITHUB_REF_NAME#v}" --notes-file docs/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
