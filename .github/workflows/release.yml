name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 || $0 == "## " v {p=1; next} /^## /{p=0} p' CHANGELOG.md > notes.md
          test -n "$(tr -d '[:space:]' < notes.md)" || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          { echo; cat docs/release-notes.md; } >> notes.md
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm dist
      # One release created after both builds; electron-builder's own publishing races and makes two.
      - run: gh release create "$GITHUB_REF_NAME" release/*.dmg --title "${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
